# Servidor HTTP
quarkus.http.port=8082

# Configuración de Base de Datos (PostgreSQL Local)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/account_db
quarkus.datasource.username=postgres
quarkus.datasource.password=admin1

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Cliente REST (Apunta al customer-service)
quarkus.rest-client.customer-api.url=http://localhost:8081

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Seguridad JWT
mp.jwt.verify.issuer=https://bank.com
mp.jwt.verify.
